services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: iot-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: iot-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  spark:
    image: apache/spark:4.1.3-python3
    container_name: iot-spark
    depends_on:
      - kafka
    command: tail -f /dev/null

    environment:
      SPARK_JARS_IVY: /tmp/.ivy2

    ports:
      - "8081:8080"
      - "7077:7077"

    volumes:
      - ../spark:/opt/spark-apps

  spark-streaming:
    image: apache/spark:4.1.3-python3
    container_name: iot-spark-streaming
    depends_on:
      - kafka
      - spark
    volumes:
      - ../spark:/opt/spark-apps
    command: >
      /opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
      --conf spark.jars.ivy=/tmp/.ivy2
      /opt/spark-apps/streaming.py
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=iotadmin
      - DOCKER_INFLUXDB_INIT_PASSWORD=iotpassword123
      - DOCKER_INFLUXDB_INIT_ORG=iot_org
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=iot-super-secret-token-12345
    volumes:
      - influxdb-data:/var/lib/influxdb2

  backend:
    build: ../backend
    container_name: iot-backend
    depends_on:
      - kafka
      - influxdb
    ports:
      - "8000:8000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=iot-super-secret-token-12345
      - INFLUXDB_ORG=iot_org
      - INFLUXDB_BUCKET=sensor_data
    volumes:
      - ../backend:/app

volumes:
  influxdb-data: